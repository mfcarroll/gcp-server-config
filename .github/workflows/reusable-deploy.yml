name: Reusable Build and Deploy

on:
  workflow_call:
    inputs:
      appname:
        required: true
        type: string
      appdata_dirs:
        required: false
        type: string
        default: "[]"
    secrets:
      SERVER_HOSTNAME:
        required: true
      DOMAIN_NAME:
        required: true
      ANSIBLE_SSH_PRIVATE_KEY:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      GH_PAT:
        required: true
      APP_ENV_FILE:
        required: false

env:
  APPNAME: ${{ inputs.appname }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get short git commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-images/${{ inputs.appname }}:latest
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/app-images/${{ inputs.appname }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      # 1. Install cloudflared (Lightning Fast Method)
      - name: Install cloudflared
        run: |
          # Skips the slow 'apt-get update' by grabbing the standalone binary directly (~1-2 seconds)
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      # 2. Configure SSH globally for the runner
      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_gcp
          chmod 600 ~/.ssh/id_ed25519_gcp

          # Write SSH config (Updated to match the binary install path)
          cat << 'EOF' > ~/.ssh/config
          Host ${{ secrets.SERVER_HOSTNAME }}
            IdentityFile ~/.ssh/id_ed25519_gcp
            User dev
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      - name: Check for compose file type
        id: check_files
        run: |
          if [[ -f compose.yml ]]; then
            echo "file_to_use=compose.yml" >> $GITHUB_OUTPUT
          else
            echo "file_to_use=compose.yml.template" >> $GITHUB_OUTPUT
          fi

      - name: Checkout ansible config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gcp-server-config
          token: ${{ secrets.GH_PAT }}
          path: ansible-config

      - name: Create services directory locally
        run: mkdir -p ./ansible-config/services

      - name: Prepare compose file for deployment
        run: |
          sed "s/__APP_NAME__/${{ env.APPNAME }}/g" ${{ steps.check_files.outputs.file_to_use }} > ./ansible-config/services/${{ env.APPNAME }}.yml
          sed -i "s/__IMAGE_TAG__/${{ needs.build.outputs.short_sha }}/g" ./ansible-config/services/${{ env.APPNAME }}.yml

      # 3. Use native SCP (Respects ~/.ssh/config)
      - name: Upload compose file to server
        run: |
          scp ./ansible-config/services/${{ env.APPNAME }}.yml ${{ secrets.SERVER_HOSTNAME }}:/home/dev/

      # 4. Use native SSH for mkdir (Respects ~/.ssh/config)
      - name: Create app-specific data directories
        run: |
          # Loop through the list locally on the runner using jq
          if [ "${{ inputs.appdata_dirs }}" != "[]" ]; then
            echo '${{ inputs.appdata_dirs }}' | jq -r '.[]' | while read dir; do
              ssh ${{ secrets.SERVER_HOSTNAME }} "sudo mkdir -p /opt/docker/appdata/${{ inputs.appname }}/$dir"
            done
          fi

      - name: Check for .env file secret
        id: check_secret
        env:
          THE_SECRET: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -n "$THE_SECRET" ]; then echo "defined=true" >> "$GITHUB_OUTPUT"; else echo "defined=false" >> "$GITHUB_OUTPUT"; fi

      # 5. Use native SSH for .env writing
      - name: Write .env file to server
        if: steps.check_secret.outputs.defined == 'true'
        env:
          ENV_CONTENT: ${{ secrets.APP_ENV_FILE }}
        run: |
          echo "$ENV_CONTENT" | ssh ${{ secrets.SERVER_HOSTNAME }} "sudo tee /opt/docker/appdata/${{ inputs.appname }}/.env > /dev/null && sudo chmod 600 /opt/docker/appdata/${{ inputs.appname }}/.env"

      - name: Cache pip and Install Ansible
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 6. Simplify Ansible (Smart Execution)
      - name: Install Ansible and Run Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          # Ansible looks for ansible.cfg in the working directory or
          # $ANSIBLE_CONFIG — never beside the playbook. This repo is checked out
          # into ./ansible-config, so without this its ssh keepalive settings
          # were being loaded exactly never.
          ANSIBLE_CONFIG: ./ansible-config/ansible.cfg
        run: |
          python3 -m pip install ansible

          # Ansible Inventory
          echo "[servers]" > ./ansible-config/inventory
          echo "app-server-1 ansible_host=${{ secrets.SERVER_HOSTNAME }} ansible_user=dev ansible_python_interpreter=/usr/bin/python3" >> ./ansible-config/inventory

          # SMART EXECUTION: Check if the proxy is already configured on the remote server
          # If /etc/sslh.cfg exists, we assume infra is good and only run the 'deploy' tag.
          if ssh ${{ secrets.SERVER_HOSTNAME }} "test -f /etc/sslh.cfg"; then
            echo "Proxy is already configured. Running only the app deployment tasks..."
            EXTRA_ARGS="--tags deploy"
          else
            echo "Server infrastructure missing. Running the FULL proxy & server setup..."
            EXTRA_ARGS=""
          fi

          # The deployment. This exit code is the verdict on the deploy.
          ansible-playbook \
            -i ./ansible-config/inventory \
            ./ansible-config/playbook.yml \
            $EXTRA_ARGS --skip-tags cleanup \
            --vault-password-file <(echo ${{ secrets.ANSIBLE_VAULT_PASSWORD }}) \
            --extra-vars "app_name=${{ env.APPNAME }} domain_name=${{ secrets.DOMAIN_NAME }}"

          echo "Deployment handed off. The stack comes up on the host."

      # Whether the app is serving, asked over HTTP from here.
      #
      # This needs no ssh, so the connection dropping while the instance is
      # saturated cannot make a working deploy look broken — which is what kept
      # happening. It also tests the thing that actually matters instead of
      # Ansible's ability to reconnect: /api/health is a real route, and /api/*
      # returns 404 rather than falling through to the SPA, so a 200 here means
      # the container is genuinely serving.
      - name: Wait for the app to come back
        run: |
          URL="https://${{ secrets.DOMAIN_NAME }}/api/health"
          echo "Polling $URL"
          # Sized from a measured deploy, not a guess. On 2026-09-14 the play
          # handed off at 19:44:46, the container did not start until 19:51:12
          # — six and a half minutes, mostly pulling the image onto a small
          # instance — and the app answered around 19:52:40 after Deno spent
          # ~70s loading before its first log line. A five-minute budget failed
          # a deploy that was working, which is the same false failure in a new
          # place. Fifteen minutes is roughly double the observed worst case;
          # the cost of the ceiling being high is only paid when a deploy is
          # genuinely broken.
          for i in $(seq 1 180); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "✅ healthy after $((i * 5))s"
              exit 0
            fi
            [ $((i % 12)) -eq 0 ] && echo "  still waiting ($((i * 5))s, last: $CODE)"
            sleep 5
          done
          echo "::error::App did not return 200 from $URL within 15 minutes (last: $CODE)"
          exit 1

      # Runs even when the health gate fails: pruning images and volumes is
      # housekeeping the box needs most on a bad day, and skipping it let disk
      # accumulate precisely when someone is already busy. It cannot fail the
      # workflow either way.
      - name: Post-deploy cleanup
        if: always()
        run: |
          # Cleanup, on a fresh connection, and never able to fail the deploy.
          # Bringing the stack up saturates a small instance and the control
          # connection often does not survive it. ansible-playbook then exits 4
          # for the unreachable host even when every task that hit it was
          # ignored, which is how a deploy that had already succeeded kept being
          # reported red. Discarding this exit code is the point.
          ansible-playbook \
            -i ./ansible-config/inventory \
            ./ansible-config/playbook.yml \
            --tags cleanup \
            --vault-password-file <(echo ${{ secrets.ANSIBLE_VAULT_PASSWORD }}) \
            --extra-vars "app_name=${{ env.APPNAME }} domain_name=${{ secrets.DOMAIN_NAME }}" \
            || echo "::warning::Post-deploy cleanup did not complete. The deployment itself succeeded."

[defaults]
host_key_checking = False
# The control connection runs over a Cloudflare tunnel, which goes unresponsive
# while the box is busy restarting containers. Without keepalives the session is
# torn down mid-play and the host is reported unreachable.
timeout = 60

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ConnectTimeout=30 -o ConnectionAttempts=3
retries = 3
